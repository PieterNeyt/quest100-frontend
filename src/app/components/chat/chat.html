<div class="chat-container">
  <div class="chat-header">
    <h3>Live Chat</h3>
  </div>

  <div class="messages-area">
    @for (m of chatLog(); track $index) {
      <div class="message-wrapper" [ngClass]="{'own-message': m.senderId === currentUser}">
        <div class="message-bubble">
          @if (m.senderId !== currentUser) {
            <span class="sender-name">{{ m.sender.firstName }}</span>
          }
          <div class="message-text">{{ m.message }}</div>
        </div>

          <button
            class="report-close-btn msg-report-btn"
            (click)="openReportModal(m)"
            title="Report this message"
            aria-label="Report this message"
          >
            <ng-icon hlm name="lucideFlag" size="xs"/>
          </button>
      </div>
    }
  </div>

  <div class="input-area">
    <input
      type="text"
      placeholder="Type a message..."
      [(ngModel)]="currentInput"
      (keyup.enter)="send()">

    <button class="send-btn" (click)="send()" [disabled]="!currentInput">
      <ng-icon hlm size="base" name="lucideSendHorizonal"/>
    </button>
  </div>
</div>

@if (reportingMessage()) {
  <app-report
    [targetId]="reportingMessage()!.id"
    [contextId]="chatId()"
    [channelType]="1"
    (closed)="closeReportModal()"
  />
}
