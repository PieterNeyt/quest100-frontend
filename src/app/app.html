<nav hlmNavigationMenu class="navbar-container">
  <div class="flex-1">
    <a routerLink="/" class="text-xl font-bold tracking-tight px-4">
      Quest 100
    </a>
  </div>

  <ul hlmNavigationMenuList class="flex-2 justify-center">
    <li hlmNavigationMenuItem>
      <a hlmNavigationMenuLink routerLink="/profile">Profile</a>
    </li>
  </ul>

  <div class="flex-1 flex justify-end">
    <ul hlmNavigationMenuList>
      @if (!loginDisplay()) {
        <li hlmNavigationMenuItem>
          <button hlmNavigationMenuTrigger (click)="login()">Login</button>
        </li>
      }

      @if (loginDisplay()) {
        <li hlmNavigationMenuItem>
          <button hlmNavigationMenuTrigger (click)="logout()">Logout</button>
        </li>
      }
    </ul>
  </div>
</nav>

<main class="main">
  <!--This is to avoid reload during acquireTokenSilent() because of hidden iframe -->
  @if (!isIframe()) {
    <router-outlet></router-outlet>
  }
</main>
