<div class="editor-container">

  <div class="preview-panel">
    <div class="avatar-canvas">
      @for (layer of sortedLayers(); track layer.id) {
        <img
          [ngSrc]="layer.link"
          class="avatar-layer"
          [alt]="layer.name" fill priority>
      }
    </div>
  </div>

  <div class="shop-panel">

    <div class="tabs">
      @for (cat of categories(); track $index) {
        <button
          [class.active]="activeCategory?.name === cat.name"
          (click)="selectCategory(cat)">
          {{ cat.name }}
        </button>
      }
    </div>

    @if (activeCategory) {
      <div class="item-grid">
        @for (item of activeCategory.items; track item.id) {
          <div
            class="item-card"
            [class.equipped]="equippedItems()[item.category]?.id === item.id"
            [class.locked]="!item.isOwned"
            (click)="toggleItem(item)">

            <img [ngSrc]="item.thumbnail" class="item-thumb" [alt]="item.name" width="80" height="80">

            <div class="item-details">
              <span class="item-name">{{ item.name }}</span>

              @if (!item.isOwned) {
                <button class="buy-btn"><ng-icon name="lucideZap"/> {{ item.price }}</button>
              } @else if (equippedItems()[item.category]?.id === item.id) {
                <span class="equipped-badge">Equipped</span>
              }
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
