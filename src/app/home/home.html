<div class="home-wrapper">
  <section class="hero-container">
    <div class="welcome-header">
      <h1 class="welcome-title">
        Welcome back {{ profile()?.firstName }}, to <span class="logo-text-yellow">Quest 100</span>
      </h1>
      <p class="welcome-subtitle">
          Under here you can find links to some of the most important website you will need while studying here at the KdG.
      </p>
    </div>

    <div class="action-grid">

      <div class="action-group">
        <button class="main-action-btn">CANVAS</button>
        <button class="info-pill-btn" title="Quest Details">
          <ng-icon name="lucideInfo" class="size-6"></ng-icon>
        </button>
      </div>

      <div class="action-group">
        <button class="main-action-btn">E-STUDENT SERVICE</button>
        <button class="info-pill-btn" title="Ranking Info">
          <ng-icon name="lucideInfo" class="size-6"></ng-icon>
        </button>
      </div>

      <div class="action-group">
        <button class="main-action-btn">TIME EDIT</button>
        <button class="info-pill-btn" title="Profile Settings">
          <ng-icon name="lucideInfo" class="size-6"></ng-icon>
        </button>
      </div>

    </div>
  </section>
</div>
