<div class="qr-container">
  <div class="card">
    <h2>{{ t.t('qrCode.title') }}</h2>
    <p class="subtitle">{{ t.t('qrCode.subtitle') }}</p>

    <button
      class="generate-btn"
      (click)="generateQRCode()"
      [disabled]="isLoading()"
    >
      @if (isLoading()) {
        <span class="spinner"></span>
        {{ t.t('qrCode.generating') }}
      } @else {
        {{ t.t('qrCode.generateButton') }}
      }
    </button>

    @if (qrCodeImage()) {
      <div class="qr-result">
        <h3>{{ t.t('qrCode.scanTitle') }}</h3>
        <div class="qr-image-container">
          <img [src]="qrCodeImage()" alt="Aanwezigheids QR Code" />
        </div>
        <p class="info-text">{{ t.t('qrCode.infoText') }}</p>
      </div>
    }
  </div>
</div>
