<div class="overlay">
  <div class="modal">

    <div class="modal-accent-bar"></div>

    <div class="modal-inner">

      <div class="modal-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>

      <div class="modal-heading">
        <h1>Kies je klas</h1>
        <p>Je bent er bijna! Selecteer je richting en klas om verder te gaan.</p>
      </div>

      <div class="form-stack">

        <div class="field-group">
          <label class="field-label" for="course-select">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            Richting
          </label>
          <div class="select-wrap">
            <select
              id="course-select"
              class="custom-select"
              [disabled]="loading()"
              (change)="onCourseChange($event)"
            >
              <option value="">— Kies een richting —</option>
              @for (course of courses(); track $index) {
                <option [value]="course.Id">{{ course.Name }}</option>
              }
            </select>
            <span class="select-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </div>
        </div>

        <div class="field-group" [class.field-disabled]="!selectedCourse()">
          <label class="field-label" for="class-select">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Klas
          </label>
          <div class="select-wrap">
            <select
              id="class-select"
              class="custom-select"
              [disabled]="!selectedCourse() || loading()"
              (change)="onClassChange($event)"
            >
              <option value="">— Kies een klas —</option>
              @for (cls of availableClasses(); track $index) {
                <option [value]="cls.Id">{{ cls.Name }}</option>
              }
            </select>
            <span class="select-chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </div>
          @if (!selectedCourse()) {
            <span class="field-hint">Kies eerst een richting</span>
          }
        </div>

      </div>

      <button
        class="btn-submit"
        [disabled]="!selectedClass() || loading()"
        [class.btn-loading]="loading()"
        (click)="submit()"
      >
        @if (loading()) {
          <span class="btn-spinner"></span>
          Opslaan...
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Bevestig klas
        }
      </button>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

    </div>
  </div>
</div>
